spring.application.name=portfolio
server.port=8080
server.servlet.context-path=/api
spring.docker.compose.enabled=false

# Database Configuration
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:portfolio_db}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:portfolio_user}
spring.datasource.password=${DB_PASSWORD:portfolio_secure_pass}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.initialization-fail-timeout=0

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Logging Configuration
logging.level.root=INFO
logging.level.com.norman.portfolio=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.endpoint.shutdown.enabled=false
management.health.db.enabled=false

# Security Configuration
spring.security.user.name=admin
spring.security.user.password=${ADMIN_PASSWORD:admin123}

# Application Configuration
app.title=Portfolio Application
app.version=1.0.0
app.description=Professional Portfolio Showcase Application
app.chat.phone-notifications-enabled=${CHAT_PHONE_NOTIFICATIONS_ENABLED:false}
app.chat.owner-phone-number=${OWNER_PHONE_NUMBER:}
app.chat.twilio-account-sid=${TWILIO_ACCOUNT_SID:}
app.chat.twilio-auth-token=${TWILIO_AUTH_TOKEN:}
app.chat.twilio-from-number=${TWILIO_FROM_NUMBER:}

