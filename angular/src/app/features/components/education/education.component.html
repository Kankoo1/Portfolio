<div class="education-container">
  <div class="container">
    <h2 class="section-title">Education</h2>

    <div *ngIf="loading" class="loading">
      <div class="spinner-border"></div>
    </div>

    <div *ngIf="!loading && education.length > 0" class="education-list">
      <div *ngFor="let item of education" class="education-card card">
        <div class="card-body">
          <h5 class="card-title">{{ item.degree }} in {{ item.field }}</h5>
          <h6 class="card-subtitle mb-2 text-muted">{{ item.institution }}</h6>
          <p class="card-text">{{ item.description }}</p>
          <div class="education-meta">
            <span class="badge bg-info">
              {{ formatDate(item.startDate) }} - {{ item.endDate ? formatDate(item.endDate) : 'Present' }}
            </span>
            <span *ngIf="item.gpa" class="badge bg-success">GPA: {{ item.gpa }}</span>
          </div>
        </div>
      </div>
    </div>

    <div *ngIf="!loading && education.length === 0" class="alert alert-info">
      No education information available yet.
    </div>

    <div *ngIf="!loading" class="certifications mt-4">
      <h4 class="h5">Certifications</h4>
      <ul class="list-unstyled mb-0">
        <li *ngFor="let cert of certifications" class="d-flex align-items-start mb-2">
          <span class="me-2">▪</span>
          <span>{{ cert }}</span>
        </li>
      </ul>
    </div>
  </div>
</div>
