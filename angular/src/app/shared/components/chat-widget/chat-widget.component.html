<div class="chat-widget">
  <button class="chat-toggle" type="button" (click)="toggle()" [attr.aria-expanded]="isOpen">
    {{ isOpen ? 'Close chat' : 'Chat with me' }}
  </button>

  <section *ngIf="isOpen" class="chat-panel">
    <header class="chat-header">
      <div>
        <h3>Portfolio Assistant</h3>
        <p>Simple AI-style helper with optional phone alerting.</p>
      </div>
    </header>

    <div class="chat-messages">
      <article *ngFor="let message of messages" class="chat-message" [class.user]="message.role === 'user'">
        <p>{{ message.text }}</p>
        <small *ngIf="message.meta">{{ message.meta }}</small>
      </article>
    </div>

    <div class="chat-fields">
      <input type="text" [(ngModel)]="visitorName" placeholder="Your name (optional)">
      <input type="text" [(ngModel)]="visitorContact" placeholder="Phone or email for follow-up (optional)">
    </div>

    <div class="chat-compose">
      <textarea
        [(ngModel)]="draft"
        rows="3"
        placeholder="Ask about Nuru's experience, skills, availability, or leave a message..."></textarea>
      <button type="button" (click)="send()" [disabled]="isSending || !draft.trim()">
        {{ isSending ? 'Sending...' : 'Send' }}
      </button>
    </div>
  </section>
</div>
